<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glowing border line -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Main Wallet Graphic -->
  <g transform="translate(68, 76)">
    <!-- Base Body -->
    <rect x="30" y="90" width="316" height="230" rx="36" fill="url(#walletGrad)" opacity="0.95"/>
    <rect x="30" y="90" width="316" height="230" rx="36" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Top Flap Layer -->
    <path d="M 30 90 L 346 90 C 346 90 346 160 346 160 C 346 182 328 200 306 200 L 70 200 C 48 200 30 182 30 160 Z" fill="#d1fae5"/>
    <path d="M 30 90 L 346 90 L 346 160 C 346 182 328 200 306 200 L 70 200 C 48 200 30 182 30 160 Z" fill="none" stroke="#059669" stroke-width="4" stroke-opacity="0.2"/>

    <!-- Yen Coin Badge -->
    <circle cx="270" cy="220" r="48" fill="#047857"/>
    <circle cx="270" cy="220" r="40" fill="#059669"/>
    <circle cx="270" cy="220" r="34" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="270" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">¥</text>

    <!-- Japanese Flag / Travel Badge Top Right -->
    <g transform="translate(250, 0)">
      <circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#e5e7eb" stroke-width="4"/>
      <circle cx="50" cy="50" r="24" fill="#DC2626"/>
    </g>
  </g>
</svg>